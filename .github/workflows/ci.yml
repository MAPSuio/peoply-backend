# The entry point. Everything that gates a pull request is called from here,
# one reusable workflow per concern, so a failed check names what broke rather
# than reporting "Backend Verification" for lint, tests, the build and the
# database alike.
#
# The checks run independently and in parallel; the deploy is the only thing
# that waits, and it waits for all of them.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

# The repository default for GITHUB_TOKEN is read/write, and it is inherited by
# every job that does not say otherwise. These jobs run `npm ci` — which runs
# lifecycle scripts from the whole dependency tree — plus Biome, Jest, Prisma
# and the build, so a compromised package would execute beside a token that can
# push to master. None of the checks writes anything back to the repository, and
# `deploy` authenticates to DigitalOcean with its own secret rather than with
# this token.
#
# Declared here rather than in each reusable workflow: the calling job's
# permissions are the ceiling for the workflow it calls, so one line covers all
# five. deploy-production.yml sets `contents: read` on its own job as well.
permissions:
  contents: read

# A second push to the same branch makes the first one irrelevant. Cancel it
# rather than paying for both — except on master, where a cancelled run would
# leave the deploy in an undefined state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  unit-tests:
    name: Unit tests
    uses: ./.github/workflows/unit-tests.yml

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  database-tls:
    name: Database TLS
    uses: ./.github/workflows/database-tls.yml

  # Måler bare det PR-en endrer, mot merge-basen. På push til master finnes
  # ingen base å sammenligne med, så jobben kjører ikke der — og den står
  # derfor heller ikke i deploy sin needs-liste.
  code-health:
    name: Code Health
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/code-health.yml

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, unit-tests, build, database-tls]
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
