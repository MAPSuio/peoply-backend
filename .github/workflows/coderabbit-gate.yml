# CodeRabbit reviews nothing on its own. `.coderabbit.yaml` sets
# `reviews.auto_review.enabled: false` and opts in on the `review-ready` label
# instead, and this workflow is the only thing that adds that label: members
# and collaborators get it straight away, everyone else gets it once a
# maintainer approves the `coderabbit-review` environment. Spam pull requests
# therefore never reach CodeRabbit and never count against the review quota.
#
# Removing the label stops further reviews on that pull request.
name: CodeRabbit gate

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

# `pull_request_target` runs against the base branch with a writable token, so
# it is only safe as long as the pull request's own code never runs. Nothing
# here checks out the head, builds, or installs anything: the jobs read the
# event payload and call the labels API. Keep it that way.
permissions: {}

# One pending approval per pull request. A new push replaces the previous
# request rather than stacking another one on top of it.
concurrency:
  group: coderabbit-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted:
    # A branch inside this repository is the reliable trust signal: pushing one
    # requires write access. `author_association` is checked too, but only as a
    # fallback for members working from a fork, because the event payload
    # reports CONTRIBUTOR rather than MEMBER for anyone whose organization
    # membership is private. Trusting it alone sent maintainers' own pull
    # requests to the approval queue.
    #
    # `synchronize` is excluded here on purpose. Without it, a maintainer who
    # takes the label off to stop the reviews would get it put straight back
    # on by their next push. The `gated` job keeps `synchronize` so that a new
    # push to an outside pull request asks for approval again.
    if: >-
      github.event.action != 'synchronize' &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'review-ready') &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Open the pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label review-ready

  gated:
    # Everyone else. The job does not start until a member of the environment's
    # reviewer list approves it, and until then it sits pending and consumes no
    # runner time.
    if: >-
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'review-ready') &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    environment: coderabbit-review
    permissions:
      pull-requests: write
    steps:
      - name: Open the pull request for review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label review-ready
