# Ships master to DigitalOcean App Platform. Called from `ci.yml` only after
# every check is green.
#
# The app is referenced by name, so the spec stays in DigitalOcean rather than
# in this repository — it holds the production environment, including the
# database URL and the CA certificate, which must not be committed here.
#
# Migrating and seeding happens in the app's PRE_DEPLOY job, not in the build:
# the build container sits outside the app's network, and the database only
# accepts connections from trusted sources. So this still migrates production,
# one step later.
name: Deploy to production

on:
  workflow_call:

jobs:
  digitalocean:
    name: App Platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Two deploys of the same app at once leave it in an undefined state, and a
    # cancelled deploy is worse than a queued one.
    concurrency:
      group: deploy-prod-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: digitalocean/app_action/deploy@v2
        id: deploy
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: prod-peoply-backend
          print_build_logs: true
          print_deploy_logs: true

      # App Platform calls a deploy successful once the container answers its
      # health check, and the database driver connects lazily — so a release
      # that cannot reach the database deploys green and then answers 500 to
      # every request that touches data. That is not a hypothetical; it is
      # what happened, and nothing here noticed until someone opened the site.
      #
      # The URL comes from the app we just deployed rather than being written
      # down here, so this cannot drift from where the app actually lives.
      - name: Verify production can reach the database
        env:
          APP: ${{ steps.deploy.outputs.app }}
        run: |
          set -euo pipefail
          url="$(jq -er '.live_url' <<<"$APP")"
          echo "Polling ${url}/readiness"

          for attempt in $(seq 1 10); do
            status="$(curl -sS --max-time 10 -o /dev/null \
              -w '%{http_code}' "${url}/readiness" || echo 000)"
            echo "attempt ${attempt}: HTTP ${status}"

            if [ "${status}" = "200" ]; then
              echo "Production is serving."
              exit 0
            fi

            sleep 10
          done

          echo "::error::${url}/readiness never returned 200 — the release is live but cannot reach its database."
          exit 1
