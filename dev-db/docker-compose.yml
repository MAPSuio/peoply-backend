version: '3.7'
services:
    postgres:
        image: postgres:10.5
        restart: always
        environment:
          - POSTGRES_USER=pg
          - POSTGRES_PASSWORD=pg
        logging:
          options:
            max-size: 10m
            max-file: "3"
        ports:
          - '5432:5432'
        volumes: 
          - ./create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
          - ./fill_tables.sql:/docker-entrypoint-initdb.d/fill_tables.sql
          
